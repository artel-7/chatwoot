# Build Artel-7 Chatwoot CE on GitHub-hosted runners (empty ~7Gi VM).
# NEVER build this image on home hubs — hub1/2 previously OOM-rebooted mid-bundle.
# Home self-hosted runners only pull + recreate after GHCR push.

name: Build and Deploy Chatwoot Image

on:
  push:
    branches:
      - dev
      - prod
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'GHCR tag to push'
        type: choice
        options:
          - dev
          - prod
        default: prod
      deploy_home:
        description: 'Deploy to home hubs after push (self-hosted pull only)'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/artel-7/chatwoot
  # Upstream Dockerfile defaults Node heap to 4096 — too fat even on GHA.
  NODE_OPTIONS_BUILD: '--max-old-space-size=2048 --openssl-legacy-provider'

jobs:
  build:
    # GitHub-hosted: no Plane/BI/Trino competing for RAM. Hubs stay up.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      tag: ${{ steps.tags.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Resolve image tag
        id: tags
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
          elif [ "${{ github.ref }}" = "refs/heads/prod" ]; then
            TAG=prod
          else
            TAG=dev
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:${TAG}"

      - name: Strip enterprise + low-memory build knobs (CE)
        run: |
          set -euo pipefail
          rm -rf enterprise spec/enterprise
          echo -en '\nENV CW_EDITION="ce"\n' >> docker/Dockerfile
          # Serial native gem builds — parallel -j4 OOMs 7Gi machines.
          sed -i 's/bundle install -j 4/bundle install -j 1/g' docker/Dockerfile
          # Also cap pnpm/node during image build if ARG not passed somehow.
          sed -i 's/--max-old-space-size=4096/--max-old-space-size=2048/g' docker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.tag }}
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NODE_OPTIONS=${{ env.NODE_OPTIONS_BUILD }}
          provenance: false
          # GHA cache — do not use hub BuildKit.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-home:
    needs: build
    if: |
      always() && needs.build.result == 'success' && (
        github.ref == 'refs/heads/prod' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_home)
      )
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Pull and recreate Chatwoot on home hubs
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/artel-7/chatwoot:${IMAGE_TAG}"
          echo "Deploying ${IMAGE} to hub1–4 (pull only — no build on hubs)"

          deploy_hub() {
            local hub="$1"
            local compose="$2"
            echo "=== ${hub} (${compose}) ==="
            # Login token via stdin (not argv). Retag to :prod so existing hubN.yml keeps working.
            ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 bob@"$hub" \
              "docker login ghcr.io -u ${GHCR_USER} --password-stdin && \
               docker pull ${IMAGE} && \
               docker tag ${IMAGE} ghcr.io/artel-7/chatwoot:prod && \
               cd /home/bob/infrastructure && \
               docker compose -f ${compose} up -d --no-deps --force-recreate chatwoot-rails chatwoot-sidekiq && \
               sleep 8 && \
               docker compose -f ${compose} exec -T chatwoot-rails bundle exec rails db:migrate && \
               curl -sS -m 10 -o /dev/null -w 'rails:%{http_code}\n' http://127.0.0.1:3013/ || true" \
              <<<"$GHCR_TOKEN"
          }

          deploy_hub 192.168.1.201 hub1.yml
          deploy_hub 192.168.1.202 hub2.yml
          deploy_hub 192.168.1.203 hub3.yml
          deploy_hub 192.168.1.204 hub4.yml
          echo "home deploy done"
